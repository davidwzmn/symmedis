ieb",gruppe:"Markt",frage:"Argumentiert der Vertrieb wie die Außenkommunikation?"},{id:"social",label:"Social Media",kurz:"Social",gruppe:"Kommunikation",frage:"Erzeugen die Kanäle Nachfrage statt nur Reichweite?"},{id:"zielgruppen",label:"Zielgruppen",kurz:"Zielgr.",gruppe:"Strategie",frage:"Ist klar, welche Zielgruppe zuerst bedient wird?"},{id:"nutzenargumentation",label:"Nutzenargumentation",kurz:"Nutzen",gruppe:"Kommunikation",frage:"Ist der Nutzen wirtschaftlich statt nur fachlich formuliert?"},{id:"wettbewerb",label:"Wettbewerb",kurz:"Wettbew.",gruppe:"Markt",frage:"Ist die Abgrenzung zu Alternativen belegt?"}],dt=Object.fromEntries(Kt.map(i=>[i.id,i])),W0={positionierung:{beobachtung:["Das Angebot wird über Produkteigenschaften beschrieben, nicht über einen Platz im Markt.","Eine Positionierung existiert, ist aber so breit formuliert, dass sie auf mehrere Wettbewerber passt.","Die Position ist tragfähig, verliert an den Rändern der Zielgruppen aber an Schärfe.","Klare, verteidigbare Position, die in Kommunikation und Vertrieb konsistent gespiegelt wird."],ursache:["Es wurde nie entschieden, für wen das Angebot zuerst gedacht ist.","Die Positionierung wurde aus dem Produkt abgeleitet statt aus der Entscheidungssituation des Kunden.","Die Kernaussage ist gesetzt, wird aber je Kanal unterschiedlich ausgelegt.","Positionierung ist dokumentiert und wird aktiv gepflegt."],auswirkung:["Das Angebot wird über den Preis verglichen, obwohl es das nicht sein müsste.","Interessenten ordnen das Angebot falsch ein und steigen früh aus.","In Randsegmenten entstehen längere Entscheidungswege.","Die Position stützt Preis und Argumentation."],empfehlung:["Primäre Zielgruppe verbindlich festlegen und Positionierungssatz neu formulieren.","Positionierung auf ein Segment zuspitzen und in allen Kanälen vereinheitlichen.","Randsegmente separat adressieren, Kernaussage unverändert lassen.","Position halten und bei Sortimentserweiterungen erneut prüfen."]},verstaendlichkeit:{beobachtung:["Das Produkt wird fachlich korrekt, aber wirtschaftlich nicht nachvollziehbar erklärt.","Der Nutzen erschließt sich erst nach Erklärung – zu spät für die erste Entscheidung.","Die Nutzenlogik steht, die Übersetzung in Entscheidersprache ist unvollständig.","Der wirtschaftliche Nutzen wird ohne Vorwissen schnell verstanden."],ursache:["Die Kommunikation ist aus der Entwicklungsperspektive geschrieben.","Fachbegriffe werden vorausgesetzt, die die Zielgruppe nicht teilt.","Der Einstieg ist verständlich, die Tiefe springt zu schnell ins Fachliche.","Texte wurden gegen Entscheiderfragen geprüft."],auswirkung:["Entscheider steigen aus, bevor die Substanz überhaupt sichtbar wird.","Der Vertrieb muss Grundlagen erklären, statt zu verkaufen.","Vereinzelt entstehen Rückfragen, die den Abschluss verzögern.","Gespräche starten auf der richtigen Ebene."],empfehlung:["Nutzenargumentation in Entscheidersprache übersetzen und Erklärstrecke aufbauen.","Einstiegsseiten auf eine Kernaussage reduzieren, Fachtiefe nachlagern.","Fachliche Passagen mit wirtschaftlicher Einordnung ergänzen.","Verständlichkeit bei neuen Inhalten weiter prüfen."]},differenzierung:{beobachtung:["Unterschiede werden behauptet, aber weder belegt noch in Kundenvorteil übersetzt.","Belege sind vorhanden, wirken im Markt aber nicht, weil sie nicht eingesetzt werden.","Differenzierung ist erkennbar, hält dem direkten Preisvergleich noch nicht stand.","Belegte Unterschiede, konsequent als Kundenvorteil formuliert."],ursache:["Es fehlt eine Übersetzung von Eigenschaft zu Konsequenz für den Kunden.","Studien und Prüfberichte liegen vor, sind aber nicht aufbereitet.","Der Vorteil ist formuliert, aber nicht quantifiziert.","Belege sind Teil der Standardargumentation."],auswirkung:["Am Ende entscheidet der Preis.","Der Substanzvorsprung bleibt unsichtbar.","In Ausschreibungen fehlt das entscheidende Argument.","Preisdruck wird abgefedert."],empfehlung:["Vorhandene Belege sichten und in drei belastbare Vorteilsaussagen überführen.","Studienergebnisse in Vertriebsmaterial und Website einarbeiten.","Vorteil mit einer Kennzahl hinterlegen.","Belege regelmäßig aktualisieren."]},marktaktivierung:{beobachtung:["Es gibt Aktivitäten, aber keine aufeinander aufbauende Sequenz.","Einzelmaßnahmen laufen parallel, ohne sich gegenseitig zu verstärken.","Die Sequenz steht, die Übergabe an den Vertrieb verliert Substanz.","Aufeinander aufbauende Aktivierung mit messbarer Nachfrage."],ursache:["Maßnahmen werden nach Kanal geplant, nicht nach Entscheidungsweg.","Es fehlt ein definierter nächster Schritt nach dem Erstkontakt.","Die Übergabepunkte sind nicht dokumentiert.","Der Aktivierungsplan ist verbindlich."],auswirkung:["Sichtbarkeit entsteht, Nachfrage nicht.","Kontakte versanden zwischen Marketing und Vertrieb.","Ein Teil der Anfragen wird zu spät bearbeitet.","Der Funnel ist durchgängig."],empfehlung:["Kanäle zu einer Sequenz verbinden und Nachfassschritte definieren.","Übergabe zwischen Marketing und Vertrieb schriftlich festlegen.","Reaktionszeiten messen und verbindlich machen.","Sequenz beibehalten, quartalsweise nachschärfen."]},website:{beobachtung:["Die Website beschreibt das Unternehmen, führt aber zu keiner klaren Handlung.","Der Einstieg ist stark, der Weg zur Anfrage bricht in der Mitte ab.","Die Struktur trägt, einzelne Unterseiten fallen inhaltlich ab.","Klare Führung vom Einstieg bis zur Anfrage."],ursache:["Es fehlt eine definierte Zielhandlung je Seite.","Zu viele gleichwertige Handlungsaufforderungen konkurrieren.","Einzelne Seiten wurden nachträglich ergänzt und nicht eingepasst.","Seitenziele sind dokumentiert."],auswirkung:["Besucher informieren sich und verschwinden ohne Kontakt.","Die Anfragequote bleibt unter dem Möglichen.","Einzelne Themen erzeugen keine Anschlusshandlung.","Anfragen kommen qualifiziert herein."],empfehlung:["Je Seite eine Zielhandlung definieren und Einstiegsseite neu strukturieren.","Handlungsaufforderungen auf eine pro Seite reduzieren.","Schwache Unterseiten überarbeiten oder zusammenführen.","Struktur halten, Inhalte turnusmäßig prüfen."]},vertrieb:{beobachtung:["Der Vertrieb argumentiert deutlich anders als die Außenkommunikation.","Es gibt Vertriebsunterlagen, sie werden aber unterschiedlich ausgelegt.","Die Argumentation ist stimmig, Einwandbehandlung ist uneinheitlich.","Vertrieb und Kommunikation nutzen dieselbe Argumentation."],ursache:["Es existiert kein gemeinsames Argumentationsgerüst.","Unterlagen sind veraltet und werden individuell ergänzt.","Für typische Einwände fehlen abgestimmte Antworten.","Regelmäßige Abstimmung ist etabliert."],auswirkung:["Interessenten hören zwei verschiedene Versprechen.","Der Abschluss hängt stark von der einzelnen Person ab.","Verhandlungen dauern länger als nötig.","Der Prozess ist reproduzierbar."],empfehlung:["Gemeinsames Argumentationsgerüst erstellen und mit dem Vertrieb testen.","Vertriebsunterlagen auf die aktuelle Kernaussage aktualisieren.","Einwandbehandlung für die fünf häufigsten Fälle festlegen.","Abstimmung fortführen."]},social:{beobachtung:["Die Kanäle erzeugen Reichweite, aber keinen erkennbaren Kaufanlass.","Die Frequenz ist unregelmäßig, die Bildsprache uneinheitlich.","Die Kanäle sind konsistent, es fehlt die Verbindung zum Angebot.","Kanäle zahlen erkennbar auf Nachfrage ein."],ursache:["Inhalte entstehen anlassbezogen statt aus einem Themenplan.","Es fehlt eine Redaktionsplanung mit festen Formaten.","Handlungsaufforderungen fehlen weitgehend.","Redaktionsplan und Zielsetzung sind etabliert."],auswirkung:["Aufwand entsteht ohne messbaren Beitrag.","Die Marke wirkt weniger professionell als das Produkt.","Interessierte finden keinen nächsten Schritt.","Kanäle liefern qualifizierte Kontakte."],empfehlung:["Drei feste Formate definieren und mit Handlungsaufforderung versehen.","Redaktionsplan mit fester Frequenz aufsetzen.","Jeden Beitrag mit einem nächsten Schritt verknüpfen.","Formate beibehalten, Themen quartalsweise planen."]},zielgruppen:{beobachtung:["Mehrere Zielgruppen werden parallel und gleichwertig angesprochen.","Eine Priorisierung existiert auf dem Papier, nicht in der Kommunikation.","Die Hauptzielgruppe ist gesetzt, Nebengruppen sind unscharf.","Klare Priorität mit passender Ansprache je Gruppe."],ursache:["Die Entscheidung, wen man zuerst gewinnen will, wurde vermieden.","Ressourcen werden gleichmäßig verteilt statt fokussiert.","Für Nebengruppen fehlt eigenes Material.","Priorisierung ist verbindlich."],auswirkung:["Keine Gruppe wird vollständig überzeugt.","Botschaften bleiben allgemein.","Nebengruppen erzeugen Aufwand ohne Ertrag.","Mittel wirken dort, wo sie den größten Hebel haben."],empfehlung:["Primäre Zielgruppe festlegen und Kommunikation zuerst darauf ausrichten.","Ressourcen für zwei Quartale auf die Hauptgruppe konzentrieren.","Für Nebengruppen eigene, schlanke Strecke aufbauen.","Priorisierung jährlich überprüfen."]},nutzenargumentation:{beobachtung:["Der Nutzen wird als Produkteigenschaft formuliert, nicht als Ergebnis.","Nutzenaussagen sind vorhanden, aber nicht quantifiziert.","Die Argumentation trägt, der wirtschaftliche Bezug fehlt teilweise.","Nutzen ist als messbares Ergebnis formuliert."],ursache:["Es fehlt die Übersetzung von Eigenschaft zu Konsequenz.","Kennzahlen aus Projekten werden nicht erhoben.","Der Bezug zur Kostenseite fehlt.","Ergebnisse werden systematisch erfasst."],auswirkung:["Der Wert wird nicht in Zahlungsbereitschaft übersetzt.","Argumente wirken austauschbar.","In der Freigabe fehlt die wirtschaftliche Begründung.","Preisgespräche verlaufen sachlich."],empfehlung:["Nutzen in messbare Ergebnisgrößen überführen.","Drei Referenzergebnisse erheben und einsetzen.","Wirtschaftliche Einordnung ergänzen.","Kennzahlen weiter pflegen."]},wettbewerb:{beobachtung:["Die Abgrenzung zu Alternativen ist nicht dokumentiert.","Wettbewerber sind bekannt, die Abgrenzung ist aber nicht belegt.","Die Abgrenzung steht, wird im Vertrieb aber selten genutzt.","Belegte Abgrenzung, im Vertrieb verankert."],ursache:["Es findet keine strukturierte Wettbewerbsbeobachtung statt.","Vergleiche entstehen ad hoc im Einzelgespräch.","Das Vergleichsmaterial ist nicht griffbereit.","Wettbewerbsbeobachtung ist etabliert."],auswirkung:["Im direkten Vergleich fehlt das entscheidende Argument.","Preisverhandlungen starten aus der Defensive.","Chancen im Vergleich werden nicht genutzt.","Der Vergleich wird aktiv gesucht."],empfehlung:["Wettbewerbsvergleich für die drei relevantesten Alternativen aufbauen.","Vergleichsargumentation für den Vertrieb bereitstellen.","Vergleichsmaterial in den Angebotsprozess einbinden.","Beobachtung quartalsweise fortschreiben."]}},bx=[{id:"linkedin",label:"LinkedIn"},{id:"instagram",label:"Instagram"},{id:"youtube",label:"YouTube"},{id:"facebook",label:"Facebook"},{id:"fachpresse",label:"Fachmedien"}],wo={pdf:{label:"PDF",tone:"danger"},docx:{label:"Word",tone:"info"},xlsx:{label:"Excel",tone:"ok"},pptx:{label:"Präsentation",tone:"warn"},bild:{label:"Bild",tone:"neutral"}};function I0(i){return i<40?0:i<58?1:i<75?2:3}const Wi=[{id:"mr",name:"M. Reinhardt",rolle:"Lead Analystin",kuerzel:"MR",auslastung:82},{id:"jk",name:"J. Krämer",rolle:"Senior Analyst",kuerzel:"JK",auslastung:68},{id:"sb",name:"S. Brandt",rolle:"Social & Content",kuerzel:"SB",auslastung:74},{id:"tw",name:"T. Weiler",rolle:"Strategie",kuerzel:"TW",auslastung:55}],ft=Object.fromEntries(Wi.map(i=>[i.id,i])),Qn={onboarding:{label:"Onboarding",tone:"neutral"},analyse:{label:"Analyse läuft",tone:"info"},pruefung:{label:"Menschliche Prüfung",tone:"warn"},bericht:{label:"Bericht in Arbeit",tone:"brand"},umsetzung:{label:"Umsetzung",tone:"accent"},abgeschlossen:{label:"Abgeschlossen",tone:"ok"}},P0=[{id:"nordvita",unternehmen:"Nordvita Vitalstoffe GmbH",kurz:"Nordvita",branche:"Premium-NEM & Vitalstoffe",ort:"Hamburg",mitarbeitende:64,ansprechpartner:{name:"Dr. Katrin Ahlers",rolle:"Geschäftsführung",email:"k.ahlers@nordvita-demo.de",telefon:"+49 40 000000-12"},b enden strategischen Problems ist.",traeger:"Team entscheidet"},{nummer:"3",titel:"Die drei größten Umsatzbremsen benennen",text:"Wir priorisieren die Faktoren, die Ihr Wachstum tatsächlich blockieren – belegt, nicht vermutet.",traeger:"Team entscheidet"},{nummer:"4",titel:"90-Tage-Plan und Ergebnispräsentation",text:"Sie erhalten einen konkreten Umsetzungsplan und eine strategische Besprechung mit unserem Team.",traeger:"Gemeinsam mit Ihnen"}]},yr={label:"DIE PLATTFORM",headline:"Analyse, Prüfung und Umsetzung an einem Ort",text:"Diagnosis OS ist kein Berichtsversand per E-Mail. Analyse, Freigabeprozess, Aufgaben, Dokumente und Abstimmung laufen in einer Anwendung – für Sie und für uns.",module:[{titel:"Ursachenanalyse",text:"Zehn Dimensionen mit Reifegrad, Beobachtung, Ursache, Auswirkung, Empfehlung, Beleg und Priorität."},{titel:"Social-Media-Analyse",text:"Kanalreife, Frequenz, Resonanz, Konsistenz und erkannte Lücken – aus öffentlich sichtbaren Beiträgen."},{titel:"Dokumentenanalyse",text:"Vertriebsunterlagen, Kataloge und Studien mit Versionsstand, gesichtet und in die Bewertung überführt."},{titel:"Positionierung & Wettbewerb",text:"Vergleich Ihrer Aussagen mit denen der wichtigsten Anbieter im Umfeld."},{titel:"90-Tage-Plan",text:"Drei Phasen von der Ursache über die Wirkung bis zur verankerten Nachfrage."},{titel:"Aufgaben & Zusammenarbeit",text:"Klare Zuständigkeit je Maßnahme – SYMMEDIS oder Ihr Team – mit Fälligkeit und Messgröße."}]},Kj={label:"KUNDENPORTAL",headline:"Ihr Projekt, jederzeit im Blick",text:"Sie sehen den Stand der Analyse, die freigegebenen Ergebnisse und den nächsten Schritt – ohne nachfragen zu müssen.",punkte:["Projektstand, Fortschritt und Ergebnistermin auf einen Blick","Die drei größten Umsatzbremsen mit Ursache und nächster Aktion","Freigegebene Analyse mit Beleg zu jeder Bewertung","90-Tage-Plan und Aufgaben mit klarer Zuständigkeit","Dokumente, Berichte, Termine und Nachrichten an einem Ort","Kein Zugriff auf interne Notizen oder andere Mandanten"]},qj={label:"MITARBEITERPORTAL",headline:"Der interne Teil, den Sie nie zu sehen bekommen",text:"Damit die Bewertung belastbar ist, braucht sie einen Ort, an dem geprüft, korrigiert und freigegeben wird. Genau das trennt eine geprüfte Analyse von einer automatisch erzeugten Auswertung.",punkte:["Analyse-Editor für jede Dimension mit Beleg und Priorität","Freigabeprozess: vorgeschlagen → in Prüfung → bearbeitet → intern → Kunde","Interne Notizen, die den internen Bereich nie verlassen","Prüfpfad: wer hat wann was geprüft und freigegeben","Projektübergreifende Analysematrix und Portfolio-Muster","Auslastung, Fristen und Posteingang für das gesamte Team"]},Nr={label:"SOCIAL-MEDIA-ANALYSE",headline:"Reichweite ist kein Ergebnis",text:"Wir bewerten Ihre Kanäle nicht nach Followerzahlen, sondern danach, ob sie Nachfrage erzeugen: Frequenz, Resonanz, Konsistenz der Kernaussage und der Anteil an Beiträgen mit tatsächlichem Anschluss.",kriterien:[{titel:"Frequenz",text:"Erscheint überhaupt regelmäßig genug etwas, um Wirkung zu entfalten?"},{titel:"Resonanz",text:"Reagieren die richtigen Menschen – oder nur irgendwelche?"},{titel:"Konsistenz",text:"Tragen Profil, Beiträge und Website dieselbe Kernaussage?"},{titel:"Anschluss",text:"Führt ein Beitrag zu einem nächsten Schritt oder endet er im Nichts?"}]},kr={label:"90-TAGE-PLAN",headline:"Drei Phasen statt einer Maßnahmenliste",text:"Ein Plan wirkt nur, wenn er eine Reihenfolge hat. Wir schließen zuerst die Ursache, stellen dann Wirkung her und verankern zuletzt die Nachfrage.",phasen:[{label:"Tag 1–30",ziel:"Ursache schließen",text:"Positionierung und Kernaussage verbindlich festlegen, Zielgruppe priorisieren, Belege sichern."},{label:"Tag 31–60",ziel:"Wirkung herstellen",text:"Website, Vertriebsunterlagen und Kanäle auf die neue Kernaussage ausrichten."},{label:"Tag 61–90",ziel:"Nachfrage verankern",text:"Sequenz aufsetzen, Übergaben zwischen Marketing und Vertrieb definieren, Messgrößen festziehen."}]},Yi={label:"UNSER KERNANGEBOT",headline:"SYMMEDIS Ursachenanalyse",text:"Eine strategische Ursachenanalyse in 10–14 Tagen. Strukturiert durch unsere Software, bewertet durch unser Team.",leistungen:["Strukturierte Analyse von Angebotslogik und Nutzenargumentation","Prüfung, ob Marketing die Ursache oder nur ein Symptom ist","Identifikation der drei größten Umsatzbremsen","Social-Media- und Wettbewerbsauswertung","Konkreter 90-Tage-Umsetzungsplan","Strategische Ergebnispräsentation mit unserem Team","Zugang zum Kundenportal während des gesamten Projekts","Menschliche strategische Prüfung durch SYMMEDIS"],fakten:[{label:"Dauer",wert:"10–14 Tage"},{label:"Ergebnis",wert:"Strategiebericht + Plan"},{label:"Bewertung",wert:"Menschlich geprüft"},{label:"Format",wert:"Remote & vor Ort"}]},zr={label:"ÜBER SYMMEDIS",headline:"Keine klassische Agentur. Eine strategische Analyseeinheit.",text:"Wir sind ein spezialisiertes Team für erklärungsbedürftige Gesundheits-, MedTech-, Vitalstoff- und Premium-NEM-Produkte. Wir helfen Unternehmen, die tatsächlichen Ursachen für stagnierenden Umsatz zu erkennen – bevor weiteres Budget in Symptome fließt. Unsere Software strukturiert diesen Prozess. Die Verantwortung für Bewertung und Empfehlung bleibt bei uns.",prinzipien:[{titel:"Ursache vor Symptom",text:"Wir verkaufen keine Maßnahme, bevor klar ist, ob sie an der richtigen Stelle ansetzt."},{titel:"Belegt statt behauptet",text:"Jede Bewertung nennt ihren Beleg – Quelle, Umfang und Zeitraum."},{titel:"Software strukturiert, Menschen entscheiden",text:"Kein Ergebnis wird automatisch freigegeben oder versendet."}]},Lj=[{frage:"Ist das eine KI-Analyse?",antwort:"Die Software strukturiert den Prozess, wertet Unterlagen und Kanäle aus und bereitet Bewertungsvorschläge vor. Die Bewertung selbst prüft und verantwortet unser Team. Kein Ergebnis geht ungeprüft an Sie – der Freigabeprozess ist Teil des Produkts, nicht ein nachträglicher Schritt."},{frage:"Wie lange dauert eine Ursachenanalyse?",antwo  Ablauf ist vierstufig: Unterlagen sichten, Ursachen statt Symptome bestimmen, die drei größten Umsatzbremsen priorisieren, 90-Tage-Plan und Ergebnispräsentation."],rueckfragen:["Welche Unterlagen liegen bei Ihnen bereits vor – Vertriebsmaterial, Website, Studien?","Was davon würden Sie selbst als am wenigsten belastbar einschätzen?"]},{id:"ergebnis",marker:["ergebnis","bericht","liefer","bekomme ich","output","plan","präsentation"],antworten:["Sie erhalten einen Strategiebericht mit den drei größten Umsatzbremsen, einen konkreten 90-Tage-Umsetzungsplan und eine strategische Ergebnispräsentation mit unserem Team.","Das Ergebnis ist bewusst nicht nur ein Dokument: Bericht, priorisierte Umsatzbremsen, 90-Tage-Plan – und eine Besprechung, in der wir die Einordnung gemeinsam durchgehen."],rueckfragen:["Wer würde das Ergebnis bei Ihnen intern weitertragen – Geschäftsführung, Vertrieb, Marketing?","Soll der Plan eher die Kommunikation oder eher den Vertrieb adressieren?"]},{id:"ki",marker:["ki","software","automat","tool","algorithmus","menschlich"],antworten:["Unsere Software strukturiert den Analyseprozess und macht ihn nachvollziehbar. Die Bewertung und Einordnung nimmt aber immer unser Team vor – die Software ersetzt die strategische Prüfung nicht.","Automatisiert ist die Struktur, nicht das Urteil. Verantwortung für Bewertung und Empfehlung bleibt bei uns."],rueckfragen:["Was wäre Ihnen wichtiger: schnelle Struktur oder eine belastbare Einordnung durch Menschen?","Haben Sie mit rein automatisierten Analysen schon Erfahrungen gemacht?"]},{id:"passung",marker:["passt","geeignet","für uns","sinnvoll","lohnt","richtig"],antworten:["Eine Ursachenanalyse ist sinnvoll, wenn Ihr Produkt erklärungsbedürftig und hochwertig positioniert ist, das Marketing läuft – und der Umsatz sich trotzdem nicht entsprechend entwickelt.","Der typische Fall bei uns: gute Substanz, laufende Aktivitäten, mehrere Zielgruppen, und Vertrieb und Außenkommunikation argumentieren unterschiedlich."],ru
