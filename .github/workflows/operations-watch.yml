name: Operations Watch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/supabase-auth-foundation
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read
  id-token: write
  statuses: write

concurrency:
  group: symmedis-operations-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Record pending operations status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"symmedis/operations-health",description:"Operations health checks are running",target_url:process.argv[1]}))' "$target_url")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
      - name: Checkout monitored branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Evaluate operations health
        env:
          GH_TOKEN: ${{ github.token }}
          SYMMEDIS_RELEASE_BRANCH: ${{ github.ref_name }}
          SYMMEDIS_LIVE_URL: https://davidwzmn.github.io/symmedis/
          SYMMEDIS_HEALTH_WINDOW_DAYS: '30'
          SYMMEDIS_HEALTH_MIN_RUNS: '5'
          SYMMEDIS_HEALTH_MIN_SUCCESS_RATE: '0.95'
          SYMMEDIS_HEALTH_MAX_AGE_HOURS: '48'
          SYMMEDIS_HEALTH_ENFORCE_HISTORY: ${{ github.event_name == 'schedule' }}
        run: node scripts/operations-health.mjs
      - name: Evaluate private operational metrics
        shell: bash
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=symmedis-operations-watch"
          oidc_json="$(curl --silent --show-error --fail-with-body --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$token_url")"
          oidc="$(printf '%s' "$oidc_json" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null" || { echo "GitHub OIDC Token fehlt." >&2; exit 1; }
          echo "::add-mask::${oidc}"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://jmxxinrvszwggcxvlwfs.supabase.co/functions/v1/operations-health-snapshot' > operations-metrics.json
          node - <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('operations-metrics.json', 'utf8'))
          if (data.ok !== true || !Array.isArray(data.summary) || !Array.isArray(data.alerts)) {
            console.error('Operational metric snapshot contract invalid.')
            process.exit(1)
          }
          const lines = ['', '## Private operational metrics (24h)', '', `Status: **${String(data.status || 'unknown').toUpperCase()}**`, `Signals: ${data.summary.length}`, `Alerts: ${data.alerts.length}`]
          for (const alert of data.alerts) lines.push(`- ${alert.severity}: ${alert.signal} — ${alert.detail}`)
          lines.push('', `Measurement gap: ${data.measurementGap}`)
          fs.appendFileSync('operations-health.md', `${lines.join('\n')}\n`)
          if (data.status === 'failure') process.exit(2)
          if (data.status === 'warning') console.log('::warning::Operational metrics contain SEV-3 degradation signals.')
          NODE
      - name: Publish health summary
        if: always()
        shell: bash
        run: |
          if [[ -f operations-health.md ]]; then
            cat operations-health.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve health history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-health-${{ github.run_id }}
          path: |
            operations-health.json
            operations-health.md
            operations-metrics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record operations status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Operations health threshold breached"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live synthetics and operational metrics passed"
          fi
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:process.argv[1],context:"symmedis/operations-health",description:process.argv[2],target_url:process.argv[3]}))' "$state" "$description" "$target_url")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
