name: Apply premium homepage

on:
  push:
    branches:
      - agent/supabase-auth-foundation
    paths:
      - .github/workflows/apply-premium-homepage.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/supabase-auth-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Locate current homepage
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          target="$(grep -RIl --include='*.jsx' --include='*.tsx' 'Wachstum ist ein System' src | head -n 1 || true)"
          test -n "$target" || { echo 'Homepage source containing the current hero copy was not found.' >&2; exit 1; }
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Homepage: $target"

      - name: Build portrait data module from approved repo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/generated
          pick_image() {
            local name="$1"
            find src public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -iname "*${name}*" 2>/dev/null | head -n 1 || true
          }
          to_data_uri() {
            local file="$1"
            if [[ -z "$file" || ! -f "$file" ]]; then
              printf ''
              return
            fi
            local ext mime
            ext="${file##*.}"
            case "${ext,,}" in
              png) mime='image/png' ;;
              jpg|jpeg) mime='image/jpeg' ;;
              webp) mime='image/webp' ;;
              *) mime='application/octet-stream' ;;
            esac
            printf 'data:%s;base64,%s' "$mime" "$(base64 -w0 "$file")"
          }
          alfred="$(pick_image alfred)"
          david="$(pick_image david)"
          alfred_uri="$(to_data_uri "$alfred")"
          david_uri="$(to_data_uri "$david")"
          node - "$alfred_uri" "$david_uri" <<'NODE'
          const fs = require('fs')
          const [, , alfred = '', david = ''] = process.argv
          fs.writeFileSync('src/generated/teamPortraits.js', `export const teamPortraits = ${JSON.stringify({ alfred, david }, null, 2)}\n`)
          NODE
          echo "Alfred portrait source: ${alfred:-not present in repository}"
          echo "David portrait source: ${david:-not present in repository}"

      - name: Replace homepage with premium information architecture
        shell: bash
        env:
          TARGET: ${{ steps.locate.outputs.target }}
        run: |
          set -euo pipefail
          cat > "$TARGET" <<'EOF'
          import { Link } from 'react-router-dom'
          import { teamPortraits } from '../../generated/teamPortraits'

          const benefitCards = [
            {
              title: 'Die richtigen Prioritäten',
              text: 'Nicht jede Schwachstelle ist gleich wichtig. SYMMEDIS macht sichtbar, welche Ursachen den größten Hebel für Wachstum, Conversion und Marktwirkung haben.',
              emphasis: 'Weniger Aktionismus. Mehr Fokus auf die entscheidenden Hebel.',
            },
            {
              title: 'Nachvollziehbare Entscheidungen',
              text: 'Beobachtungen, Evidenz, Hypothesen und validierte Erkenntnisse bleiben sauber getrennt. So ist jederzeit klar, worauf eine Entscheidung tatsächlich basiert.',
              emphasis: 'Was wissen wir? Was vermuten wir? Was wurde geprüft? Was folgt daraus?',
            },
            {
              title: 'Konkrete nächste Schritte',
              text: 'Eine gute Analyse endet nicht bei einer Präsentation. Aus priorisierten Ursachen entsteht ein belastbarer Handlungsplan mit Verantwortlichkeiten und nächsten Schritten.',
              emphasis: 'Aus strategischer Klarheit wird operative Umsetzung.',
            },
          ]

          const processSteps = [
            ['01', 'Kontext verstehen', 'Unternehmen, Angebot, Markt, Zielgruppen und die konkrete Wachstumsfrage werden strukturiert zusammengeführt.'],
            ['02', 'Ursachen untersuchen', 'Wir betrachten nicht nur, was nicht funktioniert, sondern vor allem, warum es nicht funktioniert.'],
            ['03', 'Evidenz bewerten', 'Erkenntnisse werden mit Belegen verknüpft und nach Relevanz, Sicherheit und möglicher Wirkung bewertet.'],
            ['04', 'Prioritäten festlegen', 'Im Fokus stehen die Ursachen, deren Veränderung den größten strategischen und wirtschaftlichen Hebel besitzt.'],
            ['05', 'Umsetzung strukturieren', 'Aus freigegebenen Erkenntnissen entsteht ein klarer Maßnahmenplan mit Prioritäten, Verantwortlichkeiten und Abhängigkeiten.'],
          ]

          const audiences = [
            ['Gesundheitsunternehmen', 'Wenn Vertrauen, Erklärung und Differenzierung entscheidend für Nachfrage und Conversion sind.'],
            ['MedTech', 'Wenn erklärungsintensive Produkte unterschiedliche Stakeholder überzeugen müssen.'],
            ['Premium Supplements & Vitalstoffe', 'Wenn ein starker Markt allein noch keine klare Differenzierung garantiert.'],
            ['Innovative Gesundheitskonzepte', 'Wenn neue Ansätze verständlich, glaubwürdig und strategisch sauber positioniert werden müssen.'],
            ['Erklärungsintensive B2B-Angebote', 'Wenn Kaufentscheidungen mehrere Kontakte, Argumente und Vertrauensstufen benötigen.'],
          ]

          const situations = [
            'Wir investieren bereits viel in Marketing, aber der Umsatz entwickelt sich nicht entsprechend.',
            'Unsere Leistungen sind stark, aber der Markt versteht den Unterschied zum Wettbewerb nicht.',
            'Wir haben viele Maßnahmen – aber keine Klarheit, welche wirklich Priorität haben.',
            'Website, Marketing und Vertrieb funktionieren einzeln, aber nicht als geschlossenes System.',
            'Wir diskutieren intern über Ursachen, haben aber keine gemeinsame Faktenbasis.',
            'Wir wissen, dass etwas nicht stimmt – aber nicht, wo wir zuerst ansetzen müssen.',
          ]

          const team = [
            {
              key: 'alfred',
              name: 'Alfred',
              role: 'Gründer',
              text: 'Strategische Perspektive, unternehmerische Erfahrung und der Blick auf die entscheidenden Zusammenhänge hinter komplexen Wachstumsfragen.',
            },
            {
              key: 'david',
              name: 'David',
              role: 'Gründer',
              text: 'Strategische Analyse, digitale Produktentwicklung und die Übersetzung komplexer Anforderungen in nachvollziehbare Prozesse und Systeme.',
            },
          ]

          function PrimaryCta({ children = 'Diagnosegespräch anfragen', className = '' }) {
            return (
              <Link
                to="/termin"
                className={`inline-flex min-h-12 items-center justify-center rounded-full bg-lime-300 px-6 py-3 text-sm font-semibold text-slate-950 shadow-sm transition hover:bg-lime-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-400 ${className}`}
              >
                {children}
              </Link>
            )
          }

          function SecondaryLink({ to, children }) {
            return (
              <Link
                to={to}
                className="inline-flex min-h-12 items-center justify-center rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-900 transition hover:border-slate-400 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:hover:border-slate-500 dark:hover:bg-slate-800"
              >
                {children}
              </Link>
            )
          }

          function SectionHeading({ eyebrow, title, children, center = false }) {
            return (
              <div className={center ? 'mx-auto max-w-3xl text-center' : 'max-w-3xl'}>
                {eyebrow ? <p className="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">{eyebrow}</p> : null}
                <h2 className="text-balance text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl dark:text-white">{title}</h2>
                {children ? <div className="mt-5 text-base leading-7 text-slate-600 sm:text-lg dark:text-slate-300">{children}</div> : null}
              </div>
            )
          }

          export function HomePage() {
            return (
              <main className="overflow-x-clip bg-white text-slate-950 dark:bg-slate-950 dark:text-white">
                <section className="relative border-b border-slate-200 bg-gradient-to-b from-slate-50 to-white dark:border-slate-800 dark:from-slate-950 dark:to-slate-950">
                  <div className="mx-auto grid max-w-7xl gap-12 px-5 py-16 sm:px-8 sm:py-24 lg:grid-cols-[1.08fr_.92fr] lg:items-center lg:px-10 lg:py-28">
                    <div>
                      <p className="mb-5 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Wachstum ist ein System · Strategische Ursachenanalyse</p>
                      <h1 className="max-w-4xl text-balance text-4xl font-semibold leading-[1.05] tracking-[-0.04em] text-slate-950 sm:text-5xl lg:text-6xl dark:text-white">
                        Wachstum stockt selten wegen mangelnder Aktivität. <span className="text-slate-500 dark:text-slate-300">Meist fehlt die richtige Diagnose.</span>
                      </h1>
                      <p className="mt-7 max-w-3xl text-lg leading-8 text-slate-600 sm:text-xl dark:text-slate-300">
                        SYMMEDIS identifiziert die Ursachen, die Wachstum tatsächlich begrenzen – und übersetzt sie in klare Prioritäten und konkrete nächste Schritte.
                      </p>
                      <p className="mt-4 max-w-3xl text-base leading-7 text-slate-500 sm:text-lg dark:text-slate-400">
                        Für Unternehmen im Gesundheitsmarkt, MedTech und erklärungsintensive Premium-Angebote, die nicht noch mehr Maßnahmen brauchen, sondern Klarheit darüber, was wirklich verändert werden muss.
                      </p>
                      <div className="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
                        <PrimaryCta />
                        <SecondaryLink to="/demo">Plattform ansehen</SecondaryLink>
                        <Link to="/login" className="inline-flex min-h-12 items-center justify-center px-4 py-3 text-sm font-semibold text-slate-600 underline-offset-4 hover:text-slate-950 hover:underline dark:text-slate-300 dark:hover:text-white">Login</Link>
                      </div>
                      <div className="mt-9 flex flex-wrap gap-x-6 gap-y-2 text-sm text-slate-500 dark:text-slate-400">
                        <span>Strategische Ursachenanalyse</span>
                        <span>Nachvollziehbare Evidenz</span>
                        <span>Menschliche Freigabe</span>
                        <span>Konkrete Umsetzung</span>
                      </div>
                    </div>

                    <aside className="rounded-[2rem] border border-slate-200 bg-slate-950 p-6 text-white shadow-2xl shadow-slate-900/10 sm:p-8 dark:border-slate-800">
                      <p className="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Von der Frage zur Priorität</p>
                      <div className="mt-7 space-y-5">
                        {[
                          ['01', 'Symptome sichtbar machen', 'Was stockt – und wo zeigt es sich?'],
                          ['02', 'Ursachen verbinden', 'Welche Zusammenhänge erklären die Beobachtung?'],
                          ['03', 'Evidenz prüfen', 'Was ist belegt, was bleibt Hypothese?'],
                          ['04', 'Hebel priorisieren', 'Was verändert die Situation mit größter Wirkung?'],
                        ].map(([number, title, text]) => (
                          <div key={number} className="grid grid-cols-[2.5rem_1fr] gap-4 border-t border-white/10 pt-5 first:border-0 first:pt-0">
                            <span className="text-sm font-semibold text-lime-300">{number}</span>
                            <div>
                              <h2 className="font-semibold text-white">{title}</h2>
                              <p className="mt-1 text-sm leading-6 text-slate-400">{text}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </aside>
                  </div>
                </section>

                <section className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                  <SectionHeading eyebrow="Das Problem" title="Mehr Aktivität löst kein strukturelles Wachstumsproblem.">
                    <p>Neue Kampagnen, neue Inhalte, eine neue Website oder mehr Sales-Aktivität können sinnvoll sein. Wenn die eigentliche Wachstumsbremse unbekannt bleibt, erhöhen zusätzliche Maßnahmen jedoch oft nur Komplexität und Kosten.</p>
                    <p className="mt-4">SYMMEDIS betrachtet deshalb nicht einzelne Symptome isoliert, sondern die Zusammenhänge zwischen Positionierung, Nutzenargumentation, Website, Vertrieb, Kommunikation, Markt und Zielgruppe.</p>
                  </SectionHeading>
                  <div className="mt-12 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                    {['Positionierung & Marktverständnis', 'Nutzenargumentation & Angebot', 'Website & Customer Journey', 'Vertrieb & Conversion', 'Kommunikation & Vertrauen', 'Markt, Wettbewerb & Zielgruppe'].map((item) => (
                      <div key={item} className="rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 text-sm font-medium text-slate-700 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200">{item}</div>
                    ))}
                  </div>
                </section>

                <section className="border-y border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-900/40">
                  <div className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                    <SectionHeading eyebrow="Ihr Nutzen" title="Klarheit darüber, was Wachstum wirklich verhindert." />
                    <div className="mt-12 grid gap-5 lg:grid-cols-3">
                      {benefitCards.map((card) => (
                        <article key={card.title} className="rounded-[1.75rem] border border-slate-200 bg-white p-7 shadow-sm dark:border-slate-800 dark:bg-slate-950">
                          <h3 className="text-xl font-semibold tracking-tight text-slate-950 dark:text-white">{card.title}</h3>
                          <p className="mt-4 leading-7 text-slate-600 dark:text-slate-300">{card.text}</p>
                          <p className="mt-6 border-t border-slate-200 pt-5 text-sm font-semibold leading-6 text-slate-950 dark:border-slate-800 dark:text-white">{card.emphasis}</p>
                        </article>
                      ))}
                    </div>
                  </div>
                </section>

                <section className="mx-auto grid max-w-7xl gap-12 px-5 py-20 sm:px-8 lg:grid-cols-2 lg:px-10 lg:py-28">
                  <SectionHeading eyebrow="Positionierung" title="Nicht noch eine Marketinganalyse.">
                    <p>SYMMEDIS beginnt dort, wo klassische Einzelanalysen häufig aufhören. Marketing, Vertrieb, Positionierung, Angebot und digitale Touchpoints werden als Teile eines gemeinsamen Wachstumssystems betrachtet.</p>
                    <p className="mt-4">Ein Conversion-Problem kann seinen Ursprung in der Positionierung haben. Ein Vertriebsproblem kann durch unklare Nutzenkommunikation entstehen. Schwache Nachfrage muss nicht automatisch ein Marketingproblem sein.</p>
                    <p className="mt-5 font-semibold text-slate-950 dark:text-white">SYMMEDIS macht diese Zusammenhänge sichtbar.</p>
                  </SectionHeading>
                  <div className="rounded-[2rem] bg-slate-950 p-7 text-white sm:p-9">
                    <p className="text-xs font-semibold uppercase tracking-[0.18em] text-lime-300">Ein Wachstumssystem statt Silos</p>
                    <div className="mt-7 grid gap-3 sm:grid-cols-2">
                      {['Positionierung', 'Angebot', 'Kommunikation', 'Website', 'Vertrieb', 'Markt'].map((item) => <div key={item} className="rounded-2xl border border-white/10 bg-white/5 px-4 py-5 text-sm font-semibold">{item}</div>)}
                    </div>
                  </div>
                </section>

                <section id="vorgehen" className="border-y border-slate-200 bg-slate-950 text-white dark:border-slate-800">
                  <div className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                    <div className="max-w-3xl">
                      <p className="text-xs font-semibold uppercase tracking-[0.18em] text-lime-300">Vorgehen</p>
                      <h2 className="mt-3 text-balance text-3xl font-semibold tracking-tight sm:text-4xl">Von der Wachstumsfrage zur klaren Entscheidung.</h2>
                    </div>
                    <div className="mt-12 divide-y divide-white/10 border-y border-white/10">
                      {processSteps.map(([number, title, text]) => (
                        <div key={number} className="grid gap-3 py-6 sm:grid-cols-[4rem_15rem_1fr] sm:items-start sm:gap-6">
                          <span className="text-sm font-semibold text-lime-300">{number}</span>
                          <h3 className="font-semibold text-white">{title}</h3>
                          <p className="leading-7 text-slate-400">{text}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section id="plattform" className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                  <SectionHeading eyebrow="Die Plattform" title="Analyse, Entscheidung und Umsetzung in einem System.">
                    <p>SYMMEDIS schafft einen gemeinsamen Arbeitsraum für Erkenntnisse, Evidenz, Freigaben, Dokumente, Maßnahmen und Reports – vom ersten Befund bis zur Umsetzung.</p>
                  </SectionHeading>
                  <div className="mt-12 grid gap-4 md:grid-cols-2">
                    {[
                      'Analysen und Evidenz zentral strukturieren',
                      'Ursachen und Zusammenhänge nachvollziehen',
                      'Interne Bewertungen von freigegebenen Ergebnissen trennen',
                      'Dokumente und Erkenntnisse einem Projekt zuordnen',
                      'Maßnahmen priorisieren und verfolgen',
                      'Abstimmungen und finale Reports zentral bereitstellen',
                    ].map((item) => (
                      <div key={item} className="flex gap-4 rounded-2xl border border-slate-200 p-5 dark:border-slate-800">
                        <span aria-hidden="true" className="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full bg-lime-300" />
                        <span className="font-medium leading-7 text-slate-700 dark:text-slate-200">{item}</span>
                      </div>
                    ))}
                  </div>
                  <div className="mt-9 flex flex-col gap-4 rounded-[1.75rem] bg-slate-50 p-6 sm:flex-row sm:items-center sm:justify-between dark:bg-slate-900">
                    <p className="max-w-3xl font-medium leading-7 text-slate-700 dark:text-slate-200">Keine verstreuten Präsentationen, Tabellen und Chatverläufe. Ein nachvollziehbarer Prozess von der Frage bis zur Umsetzung.</p>
                    <SecondaryLink to="/demo">Plattform ansehen</SecondaryLink>
                  </div>
                </section>

                <section className="border-y border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-900/40">
                  <div className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                    <SectionHeading eyebrow="Human in the loop" title="Technologie unterstützt die Analyse. Menschen verantworten die Entscheidung.">
                      <p>SYMMEDIS kann Technologie und KI nutzen, um Informationen schneller zu strukturieren und mögliche Zusammenhänge sichtbar zu machen. Aber keine wichtige Erkenntnis wird allein deshalb wahr, weil ein System sie vorgeschlagen hat.</p>
                    </SectionHeading>
                    <div className="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                      {[
                        ['Beobachtung', 'Was tatsächlich sichtbar oder messbar ist.'],
                        ['Evidenz', 'Welche Informationen eine Aussage stützen.'],
                        ['Hypothese', 'Welche mögliche Ursache daraus abgeleitet wird.'],
                        ['Validierte Erkenntnis', 'Was nach Prüfung als belastbare Entscheidungsgrundlage freigegeben wird.'],
                      ].map(([title, text]) => (
                        <div key={title} className="rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-950">
                          <h3 className="font-semibold text-slate-950 dark:text-white">{title}</h3>
                          <p className="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300">{text}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section id="fuer-wen" className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                  <SectionHeading eyebrow="Für wen" title="Für Unternehmen, bei denen Wachstum mehr Erklärung braucht.">
                    <p>Besonders relevant ist SYMMEDIS bei erklärungsintensiven Produkten, komplexen Customer Journeys oder hohen Anforderungen an Vertrauen, Differenzierung und Positionierung.</p>
                  </SectionHeading>
                  <div className="mt-12 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                    {audiences.map(([title, text]) => (
                      <article key={title} className="rounded-[1.5rem] border border-slate-200 p-6 dark:border-slate-800">
                        <h3 className="font-semibold text-slate-950 dark:text-white">{title}</h3>
                        <p className="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300">{text}</p>
                      </article>
                    ))}
                  </div>
                </section>

                <section className="border-y border-slate-200 bg-slate-950 text-white dark:border-slate-800">
                  <div className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                    <SectionHeading eyebrow="Typische Ausgangslagen" title="Vielleicht kennen Sie eine dieser Situationen.">
                      <p className="text-slate-300">Genau dort beginnt eine strategische Ursachenanalyse.</p>
                    </SectionHeading>
                    <div className="mt-12 grid gap-4 lg:grid-cols-2">
                      {situations.map((situation) => (
                        <blockquote key={situation} className="rounded-2xl border border-white/10 bg-white/5 p-6 text-lg leading-8 text-slate-200">„{situation}“</blockquote>
                      ))}
                    </div>
                  </div>
                </section>

                <section className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                  <SectionHeading eyebrow="Das Ergebnis" title="Nicht mehr Information. Bessere Entscheidungssicherheit.">
                    <p>Am Ende soll ein verständliches Bild davon vorliegen, welche Wachstumsbremsen relevant sind, welche Evidenz die Einschätzung stützt, welche Ursachen zusammenhängen und welche Schritte zuerst umgesetzt werden sollten.</p>
                  </SectionHeading>
                  <div className="mt-10 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                    {['Relevante Wachstumsbremsen', 'Nachvollziehbare Evidenz', 'Verbundene Ursachen', 'Klare Prioritäten', 'Konkrete Maßnahmen', 'Struktur für die nächsten 90 Tage'].map((item) => <div key={item} className="rounded-2xl bg-slate-50 px-5 py-5 text-sm font-semibold text-slate-700 dark:bg-slate-900 dark:text-slate-200">{item}</div>)}
                  </div>
                </section>

                <section id="team" className="border-y border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-900/40">
                  <div className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                    <SectionHeading eyebrow="Team" title="Die Menschen hinter SYMMEDIS.">
                      <p>SYMMEDIS verbindet strategische Analyse, unternehmerische Erfahrung und digitale Produktentwicklung. Unser Anspruch: verstehen, bevor gehandelt wird; priorisieren, bevor investiert wird; nachvollziehbar entscheiden, bevor umgesetzt wird.</p>
                    </SectionHeading>
                    <div className="mt-12 grid gap-6 lg:grid-cols-2">
                      {team.map((person) => {
                        const portrait = teamPortraits[person.key]
                        return (
                          <article key={person.key} className="grid overflow-hidden rounded-[1.75rem] border border-slate-200 bg-white sm:grid-cols-[13rem_1fr] dark:border-slate-800 dark:bg-slate-950">
                            <div className="aspect-square bg-slate-200 sm:aspect-auto dark:bg-slate-800">
                              {portrait ? (
                                <img src={portrait} alt={`${person.name}, ${person.role} von SYMMEDIS`} className="h-full w-full object-cover" loading="lazy" />
                              ) : (
                                <div className="flex h-full min-h-52 items-center justify-center text-4xl font-semibold text-slate-500 dark:text-slate-400" aria-label={`Porträt von ${person.name}`}>{person.name.slice(0, 1)}</div>
                              )}
                            </div>
                            <div className="p-6 sm:p-7">
                              <p className="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">{person.role}</p>
                              <h3 className="mt-2 text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">{person.name}</h3>
                              <p className="mt-4 leading-7 text-slate-600 dark:text-slate-300">{person.text}</p>
                            </div>
                          </article>
                        )
                      })}
                    </div>
                  </div>
                </section>

                <section className="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10 lg:py-28">
                  <div className="rounded-[2rem] bg-slate-950 px-6 py-10 text-white sm:px-10 sm:py-14 lg:grid lg:grid-cols-[1fr_auto] lg:items-end lg:gap-12">
                    <div className="max-w-3xl">
                      <p className="text-xs font-semibold uppercase tracking-[0.18em] text-lime-300">Nächster Schritt</p>
                      <h2 className="mt-3 text-balance text-3xl font-semibold tracking-tight sm:text-4xl">Bevor Sie die nächste Maßnahme starten, finden Sie heraus, ob sie überhaupt die richtige ist.</h2>
                      <p className="mt-5 max-w-2xl leading-7 text-slate-300">Im Diagnosegespräch ordnen wir Ihre aktuelle Wachstumsfrage ein und prüfen, ob eine strukturierte Ursachenanalyse für Ihre Situation sinnvoll ist.</p>
                    </div>
                    <div className="mt-8 flex flex-col gap-3 sm:flex-row lg:mt-0 lg:flex-col">
                      <PrimaryCta />
                      <Link to="/demo" className="inline-flex min-h-12 items-center justify-center px-4 py-3 text-sm font-semibold text-white underline-offset-4 hover:underline">Plattform ansehen</Link>
                      <Link to="/login" className="inline-flex min-h-12 items-center justify-center px-4 py-3 text-sm font-semibold text-slate-300 underline-offset-4 hover:text-white hover:underline">Login</Link>
                    </div>
                  </div>
                </section>
              </main>
            )
          }

          export default HomePage
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Verify premium homepage
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run release:guard
          npm run security:audit
          npm run build

      - name: Commit verified homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-premium-homepage.yml
          git add -A
          git diff --cached --quiet && { echo 'No homepage changes to commit.'; exit 0; }
          git commit -m 'feat: rebuild homepage around diagnosis value proposition'
          git push origin HEAD:agent/supabase-auth-foundation
