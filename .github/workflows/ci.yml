name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Build static hash version
        env:
          VITE_ROUTER: hash
        run: npm run build -- --outDir dist-hash
      - name: Build standalone Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        run: node scripts/build-standalone.mjs pages-index.html
      - name: Publish live staging to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout --orphan pages-publish
          git rm -rf .
          cp pages-index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          git commit -m "Deploy SYMMEDIS staging ${GITHUB_SHA::7}"
          git push --force origin HEAD:gh-pages
