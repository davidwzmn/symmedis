name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Release trust guard
        run: npm run release:guard
      - name: Runtime dependency audit
        run: npm run security:audit
      - name: Build application
        run: npm run build
      - name: Route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 HOST=127.0.0.1 npm run preview > /tmp/symmedis-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /tmp/symmedis-home.html; then break; fi
            sleep 0.25
          done
          grep -q 'id="root"' /tmp/symmedis-home.html
          for route in /demo /termin /login /portal /intern; do
            body="$(curl --silent --show-error --fail "http://127.0.0.1:4173${route}")"
            printf '%s' "$body" | grep -q 'id="root"'
          done
      - name: Mobile browser smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          PORT=4174 HOST=127.0.0.1 npm run preview > /tmp/symmedis-browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 0.25
          done
          render() {
            route="$1"; target="$2"
            timeout 25s "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:4174${route}" > "$target" 2>/tmp/symmedis-chrome.log
            grep -q '<div id="root">' "$target"
            ! grep -q 'Etwas ist schiefgelaufen' "$target"
          }
          render / /tmp/symmedis-browser-home.html
          grep -q 'Wachstum ist ein System' /tmp/symmedis-browser-home.html
          render /demo /tmp/symmedis-browser-demo.html
          grep -q 'Sichere, interaktive Produktdemo' /tmp/symmedis-browser-demo.html
          grep -q '5-Minuten-Produkttour' /tmp/symmedis-browser-demo.html
          render /termin /tmp/symmedis-browser-termin.html
          grep -q 'Bringen Sie die Wachstumsfrage' /tmp/symmedis-browser-termin.html
          grep -q 'Diagnosegespräch anfragen' /tmp/symmedis-browser-termin.html
          render /login /tmp/symmedis-browser-login.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-login.html
          grep -q 'Kundenportal' /tmp/symmedis-browser-login.html
          grep -q 'Mitarbeiterportal' /tmp/symmedis-browser-login.html
          render /portal /tmp/symmedis-browser-portal.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-portal.html
          ! grep -q 'SYMMEDIS Staging Lab' /tmp/symmedis-browser-portal.html
          render /intern /tmp/symmedis-browser-intern.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-intern.html
          ! grep -q 'SYMMEDIS Staging Lab' /tmp/symmedis-browser-intern.html
      - name: Public lead ingress smoke
        shell: bash
        run: |
          set -euo pipefail
          publishable_key="$(node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('src/lib/supabase.js', 'utf8')
          const match = source.match(/DEFAULT_SUPABASE_PUBLISHABLE_KEY = '([^']+)'/)
          if (!match) process.exit(1)
          process.stdout.write(match[1])
          NODE
          )"
          body="$(curl --silent --show-error --fail --request POST --header "apikey: ${publishable_key}" --header 'Content-Type: application/json' --header 'Origin: https://davidwzmn.github.io' --data '{"website":"release-smoke-honeypot"}' 'https://jmxxinrvszwggcxvlwfs.supabase.co/functions/v1/submit-lead')"
          printf '%s' "$body" | grep -q '"ok":true'
      - name: Authenticated browser E2E
        shell: bash
        env:
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          E2E_STAFF_EXPECTED_TEXT: SYMMEDIS Staging Lab
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          PORT=4176 HOST=127.0.0.1 npm run preview > /tmp/symmedis-auth-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4176/login > /dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$chrome" E2E_BASE_URL="http://127.0.0.1:4176" node scripts/auth-browser-e2e.mjs
      - name: Build static hash version
        env:
          VITE_ROUTER: hash
        run: npm run build -- --outDir dist-hash
      - name: Build standalone Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        env:
          VITE_ROUTER: hash
          SYMMEDIS_STANDALONE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- --outDir dist-pages
          node scripts/build-standalone.mjs pages-index.html dist-pages
          grep -q "name=\"symmedis-build\" content=\"${GITHUB_SHA}\"" pages-index.html
      - name: Publish live staging to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          rm -rf /tmp/symmedis-pages
          git worktree add --detach /tmp/symmedis-pages origin/gh-pages
          cp pages-index.html /tmp/symmedis-pages/index.html
          touch /tmp/symmedis-pages/.nojekyll
          rm -f /tmp/symmedis-pages/verified.txt /tmp/symmedis-pages/verification-failed.txt
          git -C /tmp/symmedis-pages add -A
          git -C /tmp/symmedis-pages commit -m "Deploy SYMMEDIS staging ${GITHUB_SHA::7}"
          git -C /tmp/symmedis-pages push --force origin HEAD:gh-pages
      - name: Verify exact live staging release
        id: exact_live
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="https://davidwzmn.github.io/symmedis/?build=${GITHUB_SHA}"
          for attempt in {1..60}; do
            if page="$(curl --silent --show-error --fail --max-time 10 "$url")" && printf '%s' "$page" | grep -q "name=\"symmedis-build\" content=\"${GITHUB_SHA}\""; then
              echo "Live staging serves ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Live staging did not serve expected build ${GITHUB_SHA} within 5 minutes." >&2
          exit 1
      - name: Live mobile browser release smoke
        id: live_smoke
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation' && steps.exact_live.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          CHROME_BIN="$chrome" LIVE_BASE_URL="https://davidwzmn.github.io/symmedis" node scripts/live-browser-smoke.mjs 2>&1 | tee /tmp/symmedis-live-smoke.log
      - name: Record live verification failure
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation' && (steps.exact_live.outcome != 'success' || steps.live_smoke.outcome != 'success')
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "build=${GITHUB_SHA}"
            echo "status=failed"
            echo "exact_release=${{ steps.exact_live.outcome }}"
            echo "live_browser=${{ steps.live_smoke.outcome }}"
            echo "---"
            sed -n '1,120p' /tmp/symmedis-live-smoke.log 2>/dev/null || echo "no live smoke log available (not run or no log)"
          } > /tmp/symmedis-pages/verification-failed.txt
          rm -f /tmp/symmedis-pages/verified.txt
          git -C /tmp/symmedis-pages add -A
          git -C /tmp/symmedis-pages commit -m "Record failed staging verification ${GITHUB_SHA::7}"
          git -C /tmp/symmedis-pages push origin HEAD:gh-pages
      - name: Mark live staging verified
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation' && steps.exact_live.outcome == 'success' && steps.live_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > /tmp/symmedis-pages/verified.txt
          rm -f /tmp/symmedis-pages/verification-failed.txt
          git -C /tmp/symmedis-pages add -A
          git -C /tmp/symmedis-pages commit -m "Verify SYMMEDIS staging ${GITHUB_SHA::7}"
          git -C /tmp/symmedis-pages push origin HEAD:gh-pages
      - name: Enforce live staging verification
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.exact_live.outcome }}" != "success" || "${{ steps.live_smoke.outcome }}" != "success" ]]; then
            echo "Live staging verification failed: exact=${{ steps.exact_live.outcome }}, browser=${{ steps.live_smoke.outcome }}" >&2
            exit 1
          fi
          echo "Live staging verification fully passed for ${GITHUB_SHA}."
