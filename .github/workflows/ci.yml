name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Release trust guard
        run: npm run release:guard
      - name: Runtime dependency audit
        run: npm run security:audit
      - name: Build application
        run: npm run build
      - name: Route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 HOST=127.0.0.1 npm run preview > /tmp/symmedis-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /tmp/symmedis-home.html; then break; fi
            sleep 0.25
          done
          grep -q 'id="root"' /tmp/symmedis-home.html
          for route in /demo /termin /login /portal /intern; do
            body="$(curl --silent --show-error --fail "http://127.0.0.1:4173${route}")"
            printf '%s' "$body" | grep -q 'id="root"'
          done
      - name: Mobile browser smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          PORT=4174 HOST=127.0.0.1 npm run preview > /tmp/symmedis-browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 0.25
          done
          render() {
            route="$1"; target="$2"
            timeout 25s "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3500 --dump-dom "http://127.0.0.1:4174${route}" > "$target" 2>/tmp/symmedis-chrome.log
            grep -q '<div id="root">' "$target"
            ! grep -q 'Etwas ist schiefgelaufen' "$target"
          }
          render / /tmp/symmedis-browser-home.html
          grep -q 'Wachstum stockt selten wegen mangelnder Aktivität. Meist fehlt die richtige Diagnose.' /tmp/symmedis-browser-home.html
          grep -q 'Diagnosegespräch anfragen' /tmp/symmedis-browser-home.html
          grep -q 'Plattform ansehen' /tmp/symmedis-browser-home.html
          grep -q 'Menschliche Freigabe statt Blackbox' /tmp/symmedis-browser-home.html
          grep -q 'Die Menschen hinter SYMMEDIS' /tmp/symmedis-browser-home.html
          render /demo /tmp/symmedis-browser-demo.html
          grep -q 'Sichere, interaktive Produktdemo' /tmp/symmedis-browser-demo.html
          grep -q '5-Minuten-Produkttour' /tmp/symmedis-browser-demo.html
          render /termin /tmp/symmedis-browser-termin.html
          grep -q 'Bringen Sie die Wachstumsfrage' /tmp/symmedis-browser-termin.html
          grep -q 'Diagnosegespräch anfragen' /tmp/symmedis-browser-termin.html
          render /login /tmp/symmedis-browser-login.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-login.html
          grep -q 'Kundenportal' /tmp/symmedis-browser-login.html
          grep -q 'Mitarbeiterportal' /tmp/symmedis-browser-login.html
          render /portal /tmp/symmedis-browser-portal.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-portal.html
          ! grep -q 'SYMMEDIS Staging Lab' /tmp/symmedis-browser-portal.html
          render /intern /tmp/symmedis-browser-intern.html
          grep -q 'Geschützter SYMMEDIS-Zugang' /tmp/symmedis-browser-intern.html
          ! grep -q 'SYMMEDIS Staging Lab' /tmp/symmedis-browser-intern.html
      - name: Public lead ingress smoke
        shell: bash
        run: |
          set -euo pipefail
          publishable_key="$(node - <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('src/lib/supabase.js', 'utf8')
          const match = source.match(/DEFAULT_SUPABASE_PUBLISHABLE_KEY = '([^']+)'/)
          if (!match) process.exit(1)
          process.stdout.write(match[1])
          NODE
          )"
          body="$(curl --silent --show-error --fail --request POST --header "apikey: ${publishable_key}" --header 'Content-Type: application/json' --header 'Origin: https://davidwzmn.github.io' --data '{"website":"release-smoke-honeypot"}' 'https://jmxxinrvszwggcxvlwfs.supabase.co/functions/v1/submit-lead')"
          printf '%s' "$body" | grep -q '"ok":true'
      - name: Build static hash version
        env:
          VITE_ROUTER: hash
        run: npm run build -- --outDir dist-hash
      - name: Build standalone Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        env:
          VITE_ROUTER: hash
          SYMMEDIS_STANDALONE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- --outDir dist-pages
          node scripts/build-standalone.mjs pages-index.html dist-pages
          grep -q "name=\"symmedis-build\" content=\"${GITHUB_SHA}\"" pages-index.html
          rm -rf pages-site
          mkdir -p pages-site
          cp pages-index.html pages-site/index.html
          touch pages-site/.nojekyll
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6
      - name: Deploy GitHub Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Verify exact live staging release
        id: exact_live
        if: always() && steps.deployment.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="https://davidwzmn.github.io/symmedis/?build=${GITHUB_SHA}"
          for attempt in {1..120}; do
            if page="$(curl --silent --show-error --fail --max-time 10 "$url")" && printf '%s' "$page" | grep -q "name=\"symmedis-build\" content=\"${GITHUB_SHA}\""; then
              echo "Live staging serves ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "Live staging did not serve expected build ${GITHUB_SHA} within 10 minutes." >&2
          exit 1
      - name: Live mobile browser release smoke
        id: live_smoke
        if: always() && steps.deployment.outcome == 'success' && steps.exact_live.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          CHROME_BIN="$chrome" LIVE_BASE_URL="https://davidwzmn.github.io/symmedis" LIVE_EXPECTED_BUILD="$GITHUB_SHA" node scripts/live-browser-smoke.mjs 2>&1 | tee /tmp/symmedis-live-smoke.log
      - name: Upload live smoke diagnostics
        if: always() && steps.live_smoke.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.sha }}
          path: /tmp/symmedis-live-smoke.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Record live staging status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Pages deploy or live verification failed"
          if [[ "${{ steps.deployment.outcome }}" == "success" && "${{ steps.exact_live.outcome }}" == "success" && "${{ steps.live_smoke.outcome }}" == "success" ]]; then
            state="success"
            description="Exact Pages build and live browser smoke passed"
          fi
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:process.argv[1],context:"symmedis/live-staging",description:process.argv[2],target_url:"https://davidwzmn.github.io/symmedis/"}))' "$state" "$description")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
      - name: Enforce live staging verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.deployment.outcome }}" != "success" || "${{ steps.exact_live.outcome }}" != "success" || "${{ steps.live_smoke.outcome }}" != "success" ]]; then
            echo "Live staging verification failed: deploy=${{ steps.deployment.outcome }}, exact=${{ steps.exact_live.outcome }}, browser=${{ steps.live_smoke.outcome }}" >&2
            exit 1
          fi
          echo "Live staging verification fully passed for ${GITHUB_SHA}."
