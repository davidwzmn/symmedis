name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Release trust guard
        run: npm run release:guard
      - name: Runtime dependency audit
        run: npm run security:audit
      - name: Build application
        run: npm run build
      - name: Route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 HOST=127.0.0.1 npm run preview > /tmp/symmedis-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /tmp/symmedis-home.html; then
              break
            fi
            sleep 0.25
          done
          grep -q 'id="root"' /tmp/symmedis-home.html
          for route in /demo /termin /login /portal /intern; do
            body="$(curl --silent --show-error --fail "http://127.0.0.1:4173${route}")"
            printf '%s' "$body" | grep -q 'id="root"'
          done
      - name: Mobile browser smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium binary available on runner." >&2
            exit 1
          fi

          PORT=4174 HOST=127.0.0.1 npm run preview > /tmp/symmedis-browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          render() {
            route="$1"
            target="$2"
            timeout 25s "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=390,844 \
              --virtual-time-budget=3500 \
              --dump-dom "http://127.0.0.1:4174${route}" > "$target" 2>/tmp/symmedis-chrome.log
            grep -q '<div id="root">' "$target"
            if grep -q 'Etwas ist schiefgelaufen' "$target"; then
              echo "React error boundary rendered for ${route}." >&2
              exit 1
            fi
          }

          render / /tmp/symmedis-browser-home.html
          grep -q 'Wachstum ist ein System' /tmp/symmedis-browser-home.html

          render /demo /tmp/symmedis-browser-demo.html
          grep -q 'Sichere, interaktive Produktdemo' /tmp/symmedis-browser-demo.html
          grep -q '5-Minuten-Produkttour' /tmp/symmedis-browser-demo.html

          render /termin /tmp/symmedis-browser-termin.html
          grep -q 'Bringen Sie die Wachstumsfrage' /tmp/symmedis-browser-termin.html
          grep -q 'Diagnosegespräch anfragen' /tmp/symmedis-browser-termin.html
      - name: Build static hash version
        env:
          VITE_ROUTER: hash
        run: npm run build -- --outDir dist-hash
      - name: Build standalone Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        run: node scripts/build-standalone.mjs pages-index.html
      - name: Publish live staging to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout --orphan pages-publish
          git rm -rf .
          cp pages-index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          git commit -m "Deploy SYMMEDIS staging ${GITHUB_SHA::7}"
          git push --force origin HEAD:gh-pages
      - name: Verify exact live staging release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/supabase-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          url="https://davidwzmn.github.io/symmedis/?build=${GITHUB_SHA}"
          for attempt in {1..60}; do
            if page="$(curl --silent --show-error --fail --max-time 10 "$url")"; then
              if printf '%s' "$page" | grep -q "name=\"symmedis-build\" content=\"${GITHUB_SHA}\""; then
                echo "Live staging serves ${GITHUB_SHA}"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Live staging did not serve expected build ${GITHUB_SHA} within 5 minutes." >&2
          exit 1