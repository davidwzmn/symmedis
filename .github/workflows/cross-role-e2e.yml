name: Cross-Role E2E

on:
  workflow_dispatch:
  push:
    branches:
      - agent/supabase-auth-foundation

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: cross-role-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staff-customer-handover:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Record pending cross-role release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"symmedis/cross-role-e2e",description:"Secretless cross-role E2E is running",target_url:process.argv[1]}))' "$target_url")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release guards
        run: npm run release:guard
      - name: Build authenticated preview
        run: npm run build
      - name: Bootstrap ephemeral E2E identities with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=symmedis-e2e-bootstrap"
          oidc_json="$(curl --silent --show-error --fail-with-body --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$token_url")"
          oidc="$(printf '%s' "$oidc_json" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null" || { echo "GitHub OIDC Token fehlt." >&2; exit 1; }
          echo "::add-mask::${oidc}"

          bootstrap="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc}" \
            --header 'Content-Type: application/json' \
            --data "{\"action\":\"bootstrap\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
            'https://jmxxinrvszwggcxvlwfs.supabase.co/functions/v1/e2e-auth-bootstrap')"

          staff_email="$(printf '%s' "$bootstrap" | jq -r '.staff.email')"
          staff_password="$(printf '%s' "$bootstrap" | jq -r '.staff.password')"
          customer_email="$(printf '%s' "$bootstrap" | jq -r '.customer.email')"
          customer_password="$(printf '%s' "$bootstrap" | jq -r '.customer.password')"
          for value in "$staff_email" "$staff_password" "$customer_email" "$customer_password"; do
            test -n "$value" && test "$value" != "null" || { echo "Ephemere E2E-Credentials unvollständig." >&2; exit 1; }
            echo "::add-mask::${value}"
          done
          {
            echo "E2E_STAFF_EMAIL=${staff_email}"
            echo "E2E_STAFF_PASSWORD=${staff_password}"
            echo "E2E_CUSTOMER_EMAIL=${customer_email}"
            echo "E2E_CUSTOMER_PASSWORD=${customer_password}"
          } >> "$GITHUB_ENV"
          echo "Ephemere Staff-/Customer-Identitäten für GitHub Run ${GITHUB_RUN_ID} erstellt."
      - name: Start authenticated preview
        shell: bash
        run: |
          set -euo pipefail
          PORT=4176 HOST=127.0.0.1 npm run preview > /tmp/symmedis-cross-role-preview.log 2>&1 &
          echo $! > /tmp/symmedis-cross-role-preview.pid
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4176/login > /dev/null; then exit 0; fi
            sleep 0.3
          done
          cat /tmp/symmedis-cross-role-preview.log >&2
          exit 1
      - name: Run full Staff Customer handover
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          CHROME_BIN="$chrome" E2E_BASE_URL="http://127.0.0.1:4176" node scripts/cross-role-browser-e2e.mjs 2>&1 | tee /tmp/symmedis-cross-role-e2e.log
      - name: Run diagnosis outcome learning loop
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          CHROME_BIN="$chrome" E2E_BASE_URL="http://127.0.0.1:4176" node scripts/diagnosis-outcome-browser-e2e.mjs 2>&1 | tee /tmp/symmedis-diagnosis-outcome-e2e.log
      - name: Run secretless portal navigation and logout smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "No Chrome/Chromium binary available on runner." >&2; exit 1; }
          CHROME_BIN="$chrome" \
            E2E_BASE_URL="http://127.0.0.1:4176" \
            E2E_REQUIRE_AUTH="true" \
            E2E_STAFF_EXPECTED_TEXT="SYMMEDIS Staging Lab" \
            node scripts/auth-browser-e2e.mjs 2>&1 | tee /tmp/symmedis-auth-e2e.log
      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/symmedis-cross-role-preview.pid ]]; then
            kill "$(cat /tmp/symmedis-cross-role-preview.pid)" 2>/dev/null || true
          fi
      - name: Cleanup ephemeral E2E identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=symmedis-e2e-bootstrap"
          oidc_json="$(curl --silent --show-error --fail-with-body --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$token_url")"
          oidc="$(printf '%s' "$oidc_json" | jq -r '.value')"
          test -n "$oidc" && test "$oidc" != "null" || { echo "Cleanup-OIDC-Token fehlt." >&2; exit 1; }
          echo "::add-mask::${oidc}"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc}" \
            --header 'Content-Type: application/json' \
            --data "{\"action\":\"cleanup\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
            'https://jmxxinrvszwggcxvlwfs.supabase.co/functions/v1/e2e-auth-bootstrap' > /dev/null
          echo "Ephemere E2E-Identitäten für GitHub Run ${GITHUB_RUN_ID} gelöscht."
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-role-e2e-${{ github.sha }}
          path: |
            /tmp/symmedis-cross-role-preview.log
            /tmp/symmedis-cross-role-e2e.log
            /tmp/symmedis-diagnosis-outcome-e2e.log
            /tmp/symmedis-auth-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Record cross-role release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Secretless cross-role E2E failed"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Handover, diagnosis outcome loop, navigation and logout passed"
          fi
          target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:process.argv[1],context:"symmedis/cross-role-e2e",description:process.argv[2],target_url:process.argv[3]}))' "$state" "$description" "$target_url")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
          echo "Commit status symmedis/cross-role-e2e=${state} recorded for ${GITHUB_SHA}."
